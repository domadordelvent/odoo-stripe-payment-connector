version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    build: .
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./payment_stripe_connector:/mnt/extra-addons/payment_stripe_connector

volumes:
  odoo-db-data:
  odoo-web-data: